<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>History</title>
  </head>

  <body>
    <div class="container mt-5">
      <h1>Research History</h1>

      <a href="/">New Research</a>

      <hr />

      <table class="table table-striped">
        <tr>
          <th>ID</th>
          <th>Topic</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>

        {% for report in reports %}

        <tr>
          <td>{{ report[0] }}</td>

          <td>{{ report[1] }}</td>

          <td>{{ report[2] }}</td>

          <td>
            <a href="/report/{{ report[0] }}" class="btn btn-primary btn-sm">
              View
            </a>

            <a href="/delete/{{ report[0] }}" class="btn btn-danger btn-sm">
              Delete
            </a>

            <a href="/export/{{ report[0] }}" class="btn btn-success">
              Download
            </a>
          </td>
        </tr>

        {% endfor %}
      </table>
    </div>
  </body>
</html>
