<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Research Agent</title>
    <!-- Bootstrap 5.3.3 CSS Link CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light py-5">
    <div class="container" style="max-width: 800px;">
      
      <!-- Header Section -->
      <div class="mb-4">
        <h1 class="text-primary fw-bold">AI Research Agent</h1>
        <p class="text-secondary fs-5">Research any company, technology, or topic using AI.</p>
      </div>

      <!-- Navigation Links -->
      <div class="mb-4 d-flex gap-2">
        <a href="/history" class="btn btn-outline-secondary"> Research History </a>
        <a href="/search-memory" class="btn btn-outline-secondary"> Research Memory </a>
      </div>

      <!-- Search Input Card -->
      <div class="card shadow-sm mb-5">
        <div class="card-body p-4">
          <form method="POST">
            <div class="mb-3">
              <label for="topic" class="form-label fw-semibold text-muted">Enter Research Topic</label>
              <input
                id="topic"
                class="form-control form-control-lg"
                type="text"
                name="topic"
                placeholder="Research Stripe, OpenAI, Quantum Computing..."
                required
              />
            </div>
            <button id="research-btn" class="btn btn-primary btn-lg w-100 text-white" type="submit">
              Research
            </button>
          </form>
        </div>
      </div>

      <!-- Output Report Section -->
      {% if report %}
      <div class="mb-4">
        <h2 class="h4 text-dark mb-3">Generated Report</h2>
        <div class="card shadow-sm border-start border-primary border-3">
          <div class="card-body p-4 bg-white">
            <div style="white-space: pre-wrap; font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;">
              {{ report }}
            </div>
          </div>
        </div>
      </div>
      {% endif %}

    </div>

    <!-- Script Block for Loading State -->
    <script>
      document.querySelector("form").addEventListener("submit", () => {
        const btn = document.getElementById("research-btn");
        btn.innerText = "Researching...";
        btn.disabled = true; // Prevents double submissions while the LangGraph runs
      });
    </script>
    
    <!-- Bootstrap JavaScript Bundle CDN -->
    <script src="https://jsdelivr.net"></script>
  </body>
</html>
