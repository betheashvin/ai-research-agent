<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>AI Research Agent</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1>AI Research Agent</h1>

      <p>Research any company, technology, or topic using AI.</p>

      <a href="/history" class="btn btn-secondary mb-3"> Research History </a>

      <form method="POST">
        <div class="mb-3">
          <input
            class="form-control"
            type="text"
            name="topic"
            placeholder="Research Stripe, OpenAI..."
            required
          />
        </div>

        <button id="research-btn" class="btn btn-primary">Research</button>
      </form>

      {% if report %}

      <hr />

      <div class="card">
        <div class="card-body">
          <pre>{{ report }}</pre>
        </div>
      </div>

      {% endif %}
    </div>
  </body>
</html>
<script>
  document.querySelector("form").addEventListener("submit", () => {
    document.getElementById("research-btn").innerText = "Researching...";
  });
</script>
